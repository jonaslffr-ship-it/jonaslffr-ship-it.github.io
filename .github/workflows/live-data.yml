# Live SPX volatility data for the website (Cboe delayed quotes, ~15 min delay).
# Every 15 minutes during US trading hours (off-peak minutes, GitHub's scheduler is busiest on the hour):
# run the known-answer tests, build data/live/latest.{json,js} and study.js (derived analytics only), and
# deploy the site to GitHub Pages. After the close: commit a small end-of-day summary to
# data/live/history/ so the archive grows in public (written only after 16:15 ET of the valuation day).
# Pages setting: Settings -> Pages -> Source: "GitHub Actions".
name: live-data

on:
  schedule:
    - cron: "7,22,37,52 13-21 * * 1-5"   # UTC; covers 09:30-16:15 ET in both EDT and EST, plus post-close runs for the archive (pre-open runs publish nothing)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: live-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r pipeline/requirements.txt
      # Tests gate the data, not the site: if they fail, Cboe is unreachable or its quotes are from the
      # overnight session, the site is still deployed with the last deployed snapshot and shows it as stale.
      - name: Known-answer tests (synthetic Black–Scholes chain)
        id: test
        continue-on-error: true
        run: python pipeline/test_live_snapshot.py
      # A failed restore must not fall back to the committed files (a stale 2026-09-25 state): the rolling intraday
      # records would be cut for good and the site could jump back in time. So: retries, 404 = not deployed yet, else stop.
      - name: Restore the intraday records and the last snapshot from the deployed site
        run: |
          for f in intraday.json bars.json latest.json latest.js ndx.js study.js; do
            code=$(curl -s --retry 3 --retry-connrefused --retry-delay 3 -o "/tmp/$f" -w '%{http_code}' "https://jonaslffr-ship-it.github.io/data/live/$f?t=$(date +%s)")
            if [ "$code" = 200 ]; then mv "/tmp/$f" "data/live/$f"
            elif [ "$code" = 404 ]; then echo "no deployed $f yet - keeping the committed one"
            else echo "::error::restoring $f failed (HTTP $code) - stopping, the deployed site stays as it is"; exit 1; fi
          done
      # Last good five-year OHLC histories (Nasdaq's API times out now and then). Kept in the Actions cache, not published.
      - name: Restore the last good OHLC histories
        uses: actions/cache@v6
        with:
          path: ~/.cache/vol-site
          key: ohlc-${{ github.run_id }}
          restore-keys: ohlc-
      - name: Snapshot from Cboe delayed quotes
        if: steps.test.outcome == 'success'
        continue-on-error: true
        run: python pipeline/live_snapshot.py --out data/live
      # rebase onto pushes that landed meanwhile; a failed push must not block the deploy
      - name: Commit end-of-day archive
        continue-on-error: true
        run: |
          if [ -n "$(git status --porcelain data/live/history)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/live/history
            days=$(git diff --cached --name-only | xargs -n1 basename | sed 's/\.json$//' | tr '\n' ' ')
            git commit -m "data: end-of-day volatility summary $days"
            for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
