# Live SPX volatility data for the website (Cboe delayed quotes, ~15 min delay).
# Every 30 minutes during US trading hours: run the known-answer tests, build data/live/latest.{json,js}
# (derived analytics only), and deploy the site to GitHub Pages. After the close: commit a small
# end-of-day summary to data/live/history/ so the archive grows in public.
# Pages setting: Settings -> Pages -> Source: "GitHub Actions".
name: live-data

on:
  schedule:
    - cron: "*/30 13-21 * * 1-5"   # UTC; covers 09:30–16:15 ET in both EDT and EST
    - cron: "40 21 * * 1-5"        # after the close: end-of-day archive
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: live-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r pipeline/requirements.txt
      # Tests gate the data, not the site: if they fail, or Cboe is unreachable, the site is still
      # deployed with the last committed snapshot and shows it as stale.
      - name: Known-answer tests (synthetic Black–Scholes chain)
        id: test
        continue-on-error: true
        run: python pipeline/test_live_snapshot.py
      - name: Restore the intraday record from the deployed site
        run: |
          curl -sf https://jonaslffr-ship-it.github.io/data/live/intraday.json -o /tmp/intraday.json             && mv /tmp/intraday.json data/live/intraday.json             || echo "no deployed intraday record yet - keeping the committed one"
      - name: Snapshot from Cboe delayed quotes
        if: steps.test.outcome == 'success'
        continue-on-error: true
        run: python pipeline/live_snapshot.py --out data/live
      - name: Commit end-of-day archive
        run: |
          if [ -n "$(git status --porcelain data/live/history)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/live/history
            git commit -m "data: end-of-day volatility summary $(date -u +%F)"
            git push
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
